<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>522 — Layanan Sedang Tidak Aktif</title>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e5e5e5;
        --text: #171717;
        --text-muted: #525252;
        --btn-bg: #171717;
        --btn-text: #ffffff;
        --btn-hover: #262626;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --surface: #141414;
          --border: #262626;
          --text: #ededed;
          --text-muted: #a3a3a3;
          --btn-bg: #ededed;
          --btn-text: #0a0a0a;
          --btn-hover: #d4d4d4;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background-color: var(--bg);
        color: var(--text);
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        font-size: 14px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 100%;
        max-width: 480px;
        padding: 32px 24px;
        background-color: var(--surface);
        border-radius: 12px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .illustration {
        width: 180px;
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        object-fit: cover;
      }

      .badge {
        font-family: 'JetBrains Mono', Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
      }

      h1 {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.3;
      }

      p {
        color: var(--text-muted);
        font-size: 14px;
      }

      .btn {
        margin-top: 4px;
        padding: 10px 20px;
        background-color: var(--btn-bg);
        color: var(--btn-text);
        border: none;
        border-radius: 8px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }

      .btn:hover {
        background-color: var(--btn-hover);
      }

      .cf-details {
        margin-top: 8px;
        font-size: 12px;
        color: var(--text-muted);
        word-break: break-word;
      }

      .cf-details:empty {
        display: none;
      }
    </style>
  </head>
