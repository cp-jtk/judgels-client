name: Build and Deploy Client

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies & build
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dist/Dockerfile
          push: true
          tags: ghcr.io/cp-jtk/judgels-client:latest
          build-args: |
            VCS_REF=${{ github.sha }}

      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            docker pull ghcr.io/cp-jtk/judgels-client:latest
            docker stop judgels-client || true
            docker rm judgels-client || true
            docker run -d \
              --name judgels-client \
              --restart unless-stopped \
              -p 5000:5000 \
              -v /opt/judgels/client/var:/judgels/client/var \
              ghcr.io/cp-jtk/judgels-client:latest
            docker image prune -f
